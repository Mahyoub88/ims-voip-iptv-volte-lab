! BR1 - branch router with Cisco Unified CME (excerpt, transcribed from screenshot 06)
! The branch keeps local calling through CME if the WAN link to CUCM fails.
!
dial-peer voice 1 voip
 destination-pattern 1...
 session target ipv4:10.10.10.1
 dtmf-relay h245-alphanumeric
 codec g711ulaw
!
gatekeeper
 shutdown
!
telephony-service
 no auto-reg-ephone
 em logout 0:0 0:0 0:0
 max-ephones 2
 max-dn 4
 ip source-address 192.168.3.1 port 2000
 max-conferences 4 gain -6
 transfer-system full-consult
!
