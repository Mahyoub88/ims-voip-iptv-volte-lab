#!KAMAILIO
#
# S-CSCF (Serving-CSCF) - registrar and session control.
#  * REGISTER: HTTP-digest authentication against a subscriber table
#    (stands in for the HSS), bindings stored with the Path from the P-CSCF
#  * initial INVITE: a static "initial filter criteria" sends service numbers
#    to the Application Server (Asterisk); all other calls are routed to the
#    registered contact of the called user
#  * only accepts traffic from the P-CSCF and the AS (trusted IMS core)
#
# Listens on 10.0.0.11:5060/udp (the "scscf" host).

debug=2
log_stderror=yes
fork=yes
children=2
# SIP signalling leaves the CSCF marked DSCP CS3 (0x60)
tos=0x60
listen=udp:10.0.0.11:5060
alias="ims.lab"
alias="scscf.ims.lab"

#!define AS_URI "sip:10.0.0.12:5060"

loadmodule "tm.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "sanity.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"
loadmodule "auth.so"
loadmodule "htable.so"

modparam("rr", "enable_full_lr", 1)
modparam("rr", "append_fromtag", 1)
modparam("usrloc", "db_mode", 0)
modparam("registrar", "use_path", 1)
modparam("registrar", "path_mode", 0)
modparam("registrar", "default_expires", 600)
# subscriber table (HSS stand-in): user -> password
modparam("htable", "htable", "subs=>size=4;")
modparam("auth", "nonce_expire", 300)

event_route[htable:mod-init] {
    $sht(subs=>1001) = "pw1001";
    $sht(subs=>1002) = "pw1002";
    $sht(subs=>1003) = "pw1003";
    $sht(subs=>1004) = "pw1004";
}

request_route {
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }
    if (!sanity_check()) {
        exit;
    }
    # trusted core: P-CSCF and AS only
    if ($si != "10.0.0.10" && $si != "10.0.0.12") {
        sl_send_reply("403", "Use the P-CSCF");
        exit;
    }

    if (has_totag()) {
        if (loose_route()) {
            route(RELAY);
        }
        if (is_method("ACK") && t_check_trans()) {
            route(RELAY);
        }
        sl_send_reply("404", "Not here");
        exit;
    }
    if (is_method("CANCEL")) {
        if (t_check_trans()) route(RELAY);
        exit;
    }
    loose_route();

    if (is_method("REGISTER")) {
        route(REGISTRAR);
    }

    if (is_method("INVITE|MESSAGE|OPTIONS")) {
        record_route();
        # iFC: service numbers are handled by the Application Server
        if ($rU =~ "^(600|700)$" && $si != "10.0.0.12") {
            xlog("L_INFO", "S-CSCF: iFC match, $rU -> AS\n");
            $du = AS_URI;
            route(RELAY);
        }
        if (!lookup("location")) {
            xlog("L_INFO", "S-CSCF: $rU not registered\n");
            sl_send_reply("404", "Not Registered");
            exit;
        }
        xlog("L_INFO", "S-CSCF: $rm $fU -> $rU at $ru via $du\n");
        route(RELAY);
    }
    sl_send_reply("405", "Method Not Allowed");
}

route[REGISTRAR] {
    if ($sht(subs=>$fU) == $null) {
        sl_send_reply("403", "Unknown subscriber");
        exit;
    }
    if (!pv_www_authenticate("ims.lab", "$sht(subs=>$fU)", "0")) {
        www_challenge("ims.lab", "0");
        exit;
    }
    consume_credentials();
    if (!save("location")) {
        sl_reply_error();
    }
    xlog("L_INFO", "S-CSCF: registered $fU contact $ct\n");
    exit;
}

route[RELAY] {
    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}
