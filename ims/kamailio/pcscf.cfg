#!KAMAILIO
#
# P-CSCF (Proxy-CSCF) - first SIP contact point of the UEs.
#  * stateful proxy, stays in the signalling path (Record-Route)
#  * adds a Path header on REGISTER so the S-CSCF routes terminating
#    requests back through this P-CSCF
#  * forwards every initial request to the S-CSCF
#
# Listens on 10.0.0.10:5060/udp (the "pcscf" host in topology/ims_topo.py).

debug=2
log_stderror=yes
fork=yes
children=2
# SIP signalling leaves the CSCF marked DSCP CS3 (0x60)
tos=0x60
listen=udp:10.0.0.10:5060
alias="pcscf.ims.lab"

#!define SCSCF "sip:10.0.0.11:5060"

loadmodule "tm.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "sanity.so"
loadmodule "path.so"

modparam("rr", "enable_full_lr", 1)
modparam("rr", "append_fromtag", 1)
modparam("path", "use_received", 0)

request_route {
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }
    if (!sanity_check()) {
        exit;
    }

    # in-dialog requests: follow the Route set
    if (has_totag()) {
        if (loose_route()) {
            route(RELAY);
        }
        if (is_method("ACK") && t_check_trans()) {
            route(RELAY);
        }
        sl_send_reply("404", "Not here");
        exit;
    }

    if (is_method("CANCEL")) {
        if (t_check_trans()) route(RELAY);
        exit;
    }

    # pre-loaded route (terminating request coming back from the S-CSCF via Path)
    if (loose_route()) {
        xlog("L_INFO", "P-CSCF: terminating $rm to $ru\n");
        if (is_method("INVITE")) record_route();
        route(RELAY);
    }

    if (is_method("REGISTER")) {
        add_path();
        xlog("L_INFO", "P-CSCF: REGISTER $fu -> S-CSCF\n");
        $du = SCSCF;
        route(RELAY);
    }

    # originating request from a UE
    if ($si != "10.0.0.11") {
        record_route();
        xlog("L_INFO", "P-CSCF: originating $rm $fu -> $ru\n");
        $du = SCSCF;
    } else {
        record_route();
    }
    route(RELAY);
}

route[RELAY] {
    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}
