; Application Server (AS) - Asterisk 20, run inside the "as" Mininet host.
; Paths are rewritten at start-up by experiments/run_lab.py (@RUN@ -> run dir).
[directories]
astetcdir => @ETC@
astmoddir => /usr/lib/x86_64-linux-gnu/asterisk/modules
astvarlibdir => /var/lib/asterisk
astdbdir => @RUN@
astkeydir => @RUN@
astdatadir => /usr/share/asterisk
astagidir => /usr/share/asterisk/agi-bin
astspooldir => @RUN@/spool
astrundir => @RUN@
astlogdir => @RUN@/log
[options]
nofork = no
