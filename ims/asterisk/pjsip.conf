; The AS trusts the S-CSCF (10.0.0.11) and serves service numbers 600 / 700.
[transport-udp]
type = transport
protocol = udp
bind = 10.0.0.12:5060

[scscf]
type = endpoint
context = ims-services
disallow = all
allow = alaw
allow = ulaw
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes

[scscf-ip]
type = identify
endpoint = scscf
match = 10.0.0.11
