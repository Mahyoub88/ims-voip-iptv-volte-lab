; IMS service logic on the Application Server
[ims-services]
; 600 - echo service: audio is looped back to the caller (voice-path check)
exten => 600,1,Answer()
 same => n,Echo()
 same => n,Hangup()
; 700 - announcement service: plays a recorded prompt, then hangs up
exten => 700,1,Answer()
 same => n,Playback(demo-congrats)
 same => n,Hangup()
